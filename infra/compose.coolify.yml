# OpenFieldPro (panel de Construyer) para desplegar en Coolify como aplicación «Docker Compose».
#   Compose file: /infra/compose.coolify.yml · Base directory: /
#   Dominio (solo el servicio `web`): https://app.construyer.com  →  puerto 3000
# Coolify pone su propio proxy (Traefik + HTTPS); por eso aquí NO hay Caddy ni puertos publicados.
# El panel reenvía /api/* a la API por la red interna (ver OFP_API_INTERNAL_URL), con un solo origen público.
# Modo mantenimiento (OFP_MAINTENANCE_FILE): no se usa en Coolify; sin esa variable la API opera siempre normal.
# Variables: se cargan en Coolify (Environment Variables); ver .env.production.example.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ofp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ofp
    volumes:
      - ofp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofp -d ofp"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ofp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Aplica las migraciones versionadas (solo las ya commiteadas) y termina. La API espera a que acabe bien.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/ofp
      ALLOW_SCHEMA_PUSH: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        pnpm --filter @ofp/db migrate
        pnpm --filter @ofp/db schema:parity
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      TZ: America/Lima
      API_PORT: 3001
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/ofp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (mínimo 32 caracteres)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Define PUBLIC_WEB_URL}
      TRUST_PROXY: "true"
      OFP_ALLOW_PUBLIC_REGISTRATION: ${OFP_ALLOW_PUBLIC_REGISTRATION:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OFP_PUBLIC_ORG_ID: ${OFP_PUBLIC_ORG_ID:-}
      NTFY_URL: ${NTFY_URL:-}
      LEAD_ALERT_WHATSAPP_PROVIDER: ${LEAD_ALERT_WHATSAPP_PROVIDER:-}
      LEAD_ALERT_WHATSAPP_TO: ${LEAD_ALERT_WHATSAPP_TO:-}
      LEAD_ALERT_INCLUDE_CONTACT: ${LEAD_ALERT_INCLUDE_CONTACT:-false}
      LEAD_ALERT_EMAIL_TO: ${LEAD_ALERT_EMAIL_TO:-}
      CALLMEBOT_APIKEY: ${CALLMEBOT_APIKEY:-}
      WHATSAPP_CLOUD_TOKEN: ${WHATSAPP_CLOUD_TOKEN:-}
      WHATSAPP_CLOUD_PHONE_ID: ${WHATSAPP_CLOUD_PHONE_ID:-}
      WHATSAPP_CLOUD_TEMPLATE: ${WHATSAPP_CLOUD_TEMPLATE:-}
      WHATSAPP_CLOUD_TEMPLATE_LANG: ${WHATSAPP_CLOUD_TEMPLATE_LANG:-es}
      OFP_UPLOAD_DIR: /uploads
      OFP_UPLOAD_MAX_BYTES: ${OFP_UPLOAD_MAX_BYTES:-26214400}
      OFP_HEALTH_PROBE_TIMEOUT_MS: ${OFP_HEALTH_PROBE_TIMEOUT_MS:-2000}
    volumes:
      - ofp_uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/api/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Origen público (mismo que el dominio del panel): el navegador llama a /api en el mismo origen.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Define PUBLIC_API_URL}
        NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-}
        CONSTRUYER_SITE_URL: ${CONSTRUYER_SITE_URL:-https://construyer.com}
        OFP_API_INTERNAL_URL: http://api:3001
    environment:
      TZ: America/Lima
      OFP_SPONSOR_ENABLED: ${OFP_SPONSOR_ENABLED:-false}
      OFP_SPONSOR_NAME: ${OFP_SPONSOR_NAME:-}
      OFP_SPONSOR_MESSAGE: ${OFP_SPONSOR_MESSAGE:-}
      OFP_SPONSOR_URL: ${OFP_SPONSOR_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      TZ: America/Lima
      DATABASE_URL: postgres://ofp:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@postgres:5432/ofp
      REDIS_URL: redis://redis:6379
      NTFY_URL: ${NTFY_URL:-}
      WORKER_STATUS_PORT: 3020
    expose:
      - "3020"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ofp_pg:
  ofp_redis:
  ofp_uploads:
